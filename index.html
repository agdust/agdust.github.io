<!DOCTYPE html>
<html lang='ru'>

<head>
  <meta charset='UTF-8'>
  <meta
    content='width=device-width, initial-scale=1, shrink-to-fit=no'
    name='viewport'
  >
  <title>Михаил Некрытов — Frontend Developer</title>
  <link
    href='/assets/css/style.css'
    rel='stylesheet'
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/meta/apple-touch-icon.png"
  >
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/meta/favicon-32x32.png"
  >
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/meta/favicon-16x16.png"
  >
  <link
    rel="manifest"
    href="/meta/site.webmanifest"
  >

  <style>
    img.icon {
      max-width: 50px;
      max-height: 50px;
    }
  </style>
</head>

<body>
  <div id="content">
    <main
      class='main'
      role='main'
    >
      <div class="avatar">
        <img
          class='avatar__image'
          alt='Моё фото'
          src='/assets/images/photo.jpg'
        />
        <div class="avatar__status">
          🕊️
        </div>
      </div>

      <div class='info'>

        <div class="languages">
          <a
            href="/en/"
            class="languages__item"
          >
            EN
          </a>
        </div>
        <h1 class='info__name'>Михаил Некрытов</h1>
        <h2 class='info__profession'>Frontend Developer (Typescript)</h2>
        <h3 class='info__location'>
          Воронеж, Россия
          <svg>
            <use href="/assets/images/icons.svg#location">
          </svg>
        </h3>

        <a
          class="info__resume"
          href="/cv"
        >
          Резюме
        </a>

        <div class='info__contacts'>
          <a
            href='mailto:mikhail@nekrytov.com'
            aria-label="Моя электронная почта"
            class="contact-icon"
          >
            <svg>
              <use href="/assets/images/icons.svg#mail">
            </svg>
          </a>

          <a
            href='https://www.telegram.me/agdust'
            aria-label='Мой аккаунт в telegram'
            class="contact-icon"
          >
            <svg>
              <use href="/assets/images/icons.svg#telegram">
            </svg>
          </a>
          <a
            href='https://www.github.com/agdust'
            aria-label='Моя страница на github'
            class="contact-icon"
          >
            <svg>
              <use href="/assets/images/icons.svg#github">
            </svg>
          </a>
          <a
            href='https://www.linkedin.com/in/agdust/'
            aria-label='Моя страница в Linked In'
            class="contact-icon"
          >
            <svg>
              <use href="/assets/images/icons.svg#linkedin">
            </svg>
          </a>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
